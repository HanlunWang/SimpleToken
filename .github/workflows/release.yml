# Pushing a tag vX.Y.Z builds, signs, notarizes and publishes SimpleToken X.Y.Z (see docs/RELEASING.md).
# Running it by hand from main does everything except publishing: a check that signing and notarization work.
#
# The signing and notarization secrets live in the "release" environment, which only accepts runs from v* tags
# and main. They are decoded into files under the runner's temp directory, used, and removed; nothing is echoed.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: xcode-27
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write   # create the release and upload its files
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/.*CFBundleShortVersionString: "\(.*\)"/\1/p' project.yml)
          if [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "v$version" ]; then
            echo "::error::Tag $REF_NAME does not match the version in project.yml ($version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        working-directory: SimpleTokenKit
        run: swift test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Signing keychain
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          scripts/signing-keychain.sh create "$RUNNER_TEMP/signing.keychain-db" "$RUNNER_TEMP/developer-id.p12"
          rm -P "$RUNNER_TEMP/developer-id.p12"

      - name: Notary key
        env:
          KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary-key.p8"

      - name: Build, sign and notarize
        env:
          SIGN_KEYCHAIN: ${{ runner.temp }}/signing.keychain-db
          NOTARY_KEY: ${{ runner.temp }}/notary-key.p8
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
          REQUIRE_NOTARIZATION: "1"
        run: scripts/release.sh

      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          zip="dist/SimpleToken-$VERSION.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$zip" "$zip.sha256" --clobber
          elif [ -f "docs/releases/$VERSION.md" ]; then
            gh release create "$TAG" "$zip" "$zip.sha256" --verify-tag --title "SimpleToken $VERSION" --notes-file "docs/releases/$VERSION.md"
          else
            gh release create "$TAG" "$zip" "$zip.sha256" --verify-tag --title "SimpleToken $VERSION" --generate-notes
          fi

      - name: Clean up
        if: always()
        run: |
          scripts/signing-keychain.sh delete "$RUNNER_TEMP/signing.keychain-db"
          rm -f "$RUNNER_TEMP/notary-key.p8" "$RUNNER_TEMP/developer-id.p12"
